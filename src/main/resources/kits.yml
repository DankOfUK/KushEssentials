# =====================================================================
#  CustomEssentials - Kit Definitions
# =====================================================================
# Each kit is keyed by its name. Claim with /kit <name>.
#
#  cooldown    : seconds between claims. -1 = one time only, 0 = no cooldown
#  permission  : node required to claim. Defaults to essentials.kit.<name>
#  items       : list of item entries
#       material : Bukkit Material name (e.g. DIAMOND_SWORD)
#       amount   : stack size (default 1)
#       name     : custom display name (& colors, optional)
#       lore     : list of lore lines (optional)
#       enchants : map of ENCHANT_NAME: level (optional)
#                  use Bukkit enchant keys, e.g. SHARPNESS, UNBREAKING, PROTECTION
#       unbreakable : true/false (optional)
#  armor       : map of helmet/chestplate/leggings/boots (same fields as items)
#  commands    : console commands run on claim. {player} is replaced.
#  money       : (ignored unless you wire an economy) amount to grant
# =====================================================================

kits:

  starter:
    cooldown: -1               # one-time, also used as first-join kit
    permission: essentials.kit.starter
    items:
      - material: STONE_SWORD
        amount: 1
      - material: STONE_PICKAXE
        amount: 1
      - material: STONE_AXE
        amount: 1
      - material: BREAD
        amount: 16
      - material: OAK_LOG
        amount: 32
    armor:
      helmet:
        material: LEATHER_HELMET
      chestplate:
        material: LEATHER_CHESTPLATE
      leggings:
        material: LEATHER_LEGGINGS
      boots:
        material: LEATHER_BOOTS
    commands:
      - "say {player} just grabbed the starter kit!"

  daily:
    cooldown: 86400            # once per day
    permission: essentials.kit.daily
    items:
      - material: GOLDEN_APPLE
        amount: 3
      - material: COOKED_BEEF
        amount: 32
      - material: EXPERIENCE_BOTTLE
        amount: 16
      - material: IRON_INGOT
        amount: 8

  pvp:
    cooldown: 1800             # every 30 minutes
    permission: essentials.kit.pvp
    items:
      - material: DIAMOND_SWORD
        amount: 1
        name: "&c&lWarblade"
        lore:
          - "&7Forged for the arena."
        enchants:
          SHARPNESS: 3
          UNBREAKING: 3
        unbreakable: true
      - material: BOW
        amount: 1
        enchants:
          POWER: 2
      - material: ARROW
        amount: 64
      - material: GOLDEN_APPLE
        amount: 8
      - material: ENDER_PEARL
        amount: 4
    armor:
      helmet:
        material: IRON_HELMET
        enchants:
          PROTECTION: 2
      chestplate:
        material: IRON_CHESTPLATE
        enchants:
          PROTECTION: 2
      leggings:
        material: IRON_LEGGINGS
        enchants:
          PROTECTION: 2
      boots:
        material: IRON_BOOTS
        enchants:
          PROTECTION: 2
          FEATHER_FALLING: 3

  vip:
    cooldown: 43200            # every 12 hours
    permission: essentials.kit.vip   # give this to your VIP rank only
    items:
      - material: DIAMOND
        amount: 8
      - material: DIAMOND_BLOCK
        amount: 2
      - material: ENCHANTED_GOLDEN_APPLE
        amount: 2
      - material: NETHERITE_SCRAP
        amount: 2
